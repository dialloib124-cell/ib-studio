<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merci — IB Studio</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0b0b;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .card {
        width: 100%;
        max-width: 650px;
        padding: 60px 30px;
        border: 1px solid #c9a45c;
        background: #141414;
        border-radius: 18px;
      }

      .brand {
        color: #c9a45c;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0;
        font-size: clamp(36px, 7vw, 64px);
      }

      p {
        margin: 0 auto 30px;
        max-width: 520px;
        color: #d4d4d4;
        font-size: 18px;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 15px 28px;
        border-radius: 999px;
        background: #c9a45c;
        color: #0b0b0b;
        font-weight: bold;
        text-decoration: none;
      }

      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">IB Studio</div>

      <h1>Merci !</h1>

      <p>
        Votre message a bien été envoyé. Nous vous répondrons dans les plus
        brefs délais.
      </p>

      <a href="https://www.ibstudio-agency.com/">
        Retourner au site
      </a>
    </main>
  </body>
</html>
